<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <link rel="stylesheet" href="../Styles/style.css">
    <!--BOOTSTRAP CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .star-map {
            position: relative;
            background: #000;
            height: 230px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .s1 {
            width: 2px;
            height: 2px;
        }

        .s2 {
            width: 3px;
            height: 3px;
        }

        .s3 {
            width: 4px;
            height: 4px;
        }

        .star:nth-child(1) {
            top: 20px;
            left: 30px;
        }

        .star:nth-child(2) {
            top: 40px;
            left: 200px;
        }

        .star:nth-child(3) {
            top: 80px;
            left: 150px;
        }

        .star:nth-child(4) {
            top: 120px;
            left: 20px;
        }

        .star:nth-child(5) {
            top: 160px;
            left: 260px;
        }

        .star:nth-child(6) {
            top: 60px;
            left: 300px;
        }

        .star:nth-child(7) {
            top: 180px;
            left: 100px;
        }

        .star:nth-child(8) {
            top: 30px;
            left: 330px;
        }

        .star:nth-child(9) {
            top: 140px;
            left: 210px;
        }

        .star:nth-child(10) {
            top: 110px;
            left: 350px;
        }

        .planet {
            position: absolute;
            width: 45px;
            height: 45px;
            left: 260px;
            top: 90px;
            background: radial-gradient(circle, #4dd0e1, #01579b);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.8);
        }
    </style>
</head>

<body>
    <!--NAVBAR-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/"><img src="/assets/Logo.png" alt="Logo"
                    class="navbar-logo me-2">SENTINEL-NX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/">MainPanel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/Navigation/">Navigation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Sensors/">Sensors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Engines/">Engines</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Crew/">Crew</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--PAGE CONTENT-->
    <div class="container mt-4">

        <h1 class="text-center mb-4">Navigation Module</h1>

        <div class="row g-4">

            <!-- CURRENT POSITION -->
            <div class="col-md-4">
                <div class="card p-3 custom-dark-bg">
                    <h4>Current Position</h4>
                    <hr>
                    <p>Galactic sector: <strong>7B-42</strong></p>
                    <p>Coordinates:</p>
                    <p>X: 37.4219<br>Y: −122.0840<br>Z: 184 396</p>
                </div>
            </div>

            <!-- DESTINATION -->
            <div class="col-md-4">
                <div class="card p-3 custom-dark-bg">
                    <h4 class="text-center">Destination Selector</h4>
                    <hr>
                    <form>
                        <label class="form-label">Target sector</label>
                        <input type="text" class="form-control mb-2" placeholder="Example A9-04">

                        <label class="form-label">X cordinates</label>
                        <input type="number" class="form-control mb-2">

                        <label class="form-label">Y cordinates</label>
                        <input type="number" class="form-control mb-2">

                        <label class="form-label">Z cordinates</label>
                        <input type="number" class="form-control mb-3">

                        <button class="btn btn-primary w-100" type="submit">Set the goal</button>
                    </form>
                </div>
            </div>

            <!-- STAR MAP -->
            <div class="col-md-4">
                <div class="card p-3 text-center custom-dark-bg">
                    <h4>Star Map</h4>
                    <hr>

                    <div class="star-map">

                        <!-- Stars -->
                        <div class="star s1"></div>
                        <div class="star s2"></div>
                        <div class="star s3"></div>
                        <div class="star s1"></div>
                        <div class="star s2"></div>
                        <div class="star s3"></div>
                        <div class="star s1"></div>
                        <div class="star s2"></div>
                        <div class="star s3"></div>
                        <div class="star s2"></div>

                        <!-- Planet -->
                        <div class="planet"></div>

                    </div>
                </div>
            </div>

        </div>
    </div>
    <!--BOOTSTRAP JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
